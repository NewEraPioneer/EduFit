# =============================================================================
# Render Blueprint Specification (render.yaml)
# Triển khai EduFit Backend UAT lên Render Web Service (Docker Runtime)
# Database sử dụng PostgreSQL bên ngoài trên Supabase (KHÔNG tạo DB trên Render)
# =============================================================================
version: "1"

services:
  - type: web
    name: edufit-backend-uat
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: deploy/deploy-render-supabase
    healthCheckPath: /actuator/health
    autoDeployTrigger: off # Deploy có kiểm soát sau khi nghiệm thu CI / QA
    envVars:
      # Cấu hình Spring Boot Profile
      - key: SPRING_PROFILES_ACTIVE
        value: uat
      - key: SERVER_PORT
        value: "10000"

      # Cơ sở dữ liệu Supabase UAT (Nhập qua Render Dashboard - KHÔNG commit giá trị thật)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: HIKARI_MAX_POOL_SIZE
        value: "8"
      - key: HIKARI_MIN_IDLE
        value: "2"

      # Cấu hình Frontend & Cookie Security
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"

      # AI Platform (Mặc định 'stub' cho UAT nếu chưa gắn khóa Gemini)
      - key: AI_PROVIDER
        value: stub
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      # Google OAuth2
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Cổng thanh toán payOS (Kênh Test/Sandbox)
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYMENT_FRONTEND_URL
        sync: false
      - key: PAYOS_PAYOUT_ENABLED
        value: "false"

      # Email (Render Free chặn outbound SMTP 25, 465, 587)
      - key: MAIL_FROM
        value: no-reply@edufit.vn
