# Lớp dev: profile dev (nạp seed demo), Mailpit, mở cổng ra máy host, JAVA_OPTS cho máy local.
# Dùng cùng compose.yaml: đặt COMPOSE_FILE trong .env (xem .env.example).
name: edufit

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro

  mail:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAIL_HOST: mail
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@edufit.local}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      PAYMENT_FRONTEND_URL: ${PAYMENT_FRONTEND_URL:-http://localhost:3000}
      # Cấp phát heap ngay từ đầu, tránh G1GC pause do co giãn heap trên máy local.
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mail:
        condition: service_started
    healthcheck:
      interval: 20s
