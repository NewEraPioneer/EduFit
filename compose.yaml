# Nền dùng chung cho mọi môi trường: chỉ gồm db + backend.
# Không có giá trị mặc định cho biến bí mật: thiếu biến thì compose báo lỗi ngay.
# Giá trị dev/demo nằm ở compose.dev.yaml và compose.demo.yaml (chọn qua COMPOSE_FILE trong .env).
name: edufit

services:
  db:
    image: postgres:17
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?options=-c%20timezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:?Thiếu AI_PROVIDER (stub hoặc gemini)}
      STORAGE_CREDENTIALS_ROOT: /app/var/credentials
      # Tích hợp tùy chọn: để trống nghĩa là tính năng tương ứng không hoạt động.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-}
      PAYMENT_BANK_BIN: ${PAYMENT_BANK_BIN:-}
      PAYMENT_BANK_HOLDER: ${PAYMENT_BANK_HOLDER:-}
      PAYOS_PAYOUT_ENABLED: ${PAYOS_PAYOUT_ENABLED:-false}
      PAYOS_PAYOUT_CLIENT_ID: ${PAYOS_PAYOUT_CLIENT_ID:-}
      PAYOS_PAYOUT_API_KEY: ${PAYOS_PAYOUT_API_KEY:-}
      PAYOS_PAYOUT_CHECKSUM_KEY: ${PAYOS_PAYOUT_CHECKSUM_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - credential_data:/app/var/credentials
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  credential_data:
