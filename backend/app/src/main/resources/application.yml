server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 60m # NFR-04: Hết hạn sau 60 phút không hoạt động (sliding inactivity)
      cookie:
        name: EDUFIT_SESSION # Theo đặc tả authentication-contract.md
        http-only: true
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  session:
    timeout: 60m
    jdbc:
      initialize-schema: never # Flyway owns SPRING_SESSION and its attributes table.
  application:
    name: edufit-backend

  # 1. Kích hoạt Virtual Threads trên Java 21 & Spring Boot 4.x
  threads:
    virtual:
      enabled: true

  # 2. Cấu hình Cơ sở dữ liệu PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/${DB_NAME:${POSTGRES_DB:edufit}}?options=-c%20timezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:${DB_USER:${POSTGRES_USER:edufit}}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:edufit-local-only}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: EduFitHikariPool
      # Đồng bộ múi giờ PostgreSQL với tầng ứng dụng (Asia/Ho_Chi_Minh - UTC+7 theo NFR-18)
      data-source-properties:
        options: "-c timezone=Asia/Ho_Chi_Minh"

  # 3. Cấu hình Mail Service (Mailpit cho môi trường local)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # 3. Cấu hình JPA / Hibernate 7
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Không cho hibernate tự ý tạo bảng, dùng Flyway
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  # 4. Quản lý Migration DB tập trung (ADR-002 Decision 3b)
  flyway:
    enabled: true
    locations: classpath:db/migration # Quét đệ quy toàn bộ thư mục con (iam, scheduling...); seed demo chỉ có ở profile dev
    out-of-order: false # Ép thứ tự thời gian nghiêm ngặt, bắt lỗi version đặt sai ngay khi migrate
    validate-on-migrate: true # Kiểm tra checksum, migration đã áp dụng bị sửa -> build fail ngay
    baseline-on-migrate: true # Khởi tạo từ CSDL trắng, không baseline giả lập

# 5. Cấu hình AI Gateway (platform/ai)
edufit:
  mail:
    from: ${MAIL_FROM:no-reply@edufit.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000} # Dùng để dựng liên kết trong email (reset mật khẩu)
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  discovery:
    matching:
      candidate-limit: ${DISCOVERY_MATCHING_CANDIDATE_LIMIT:200}
      # Số gia sư tối đa sau lọc cứng ở Discovery trước khi xếp hạng và phân trang trong bộ nhớ
      search-limit: ${DISCOVERY_SEARCH_LIMIT:500}
      # Trọng số lọc mềm (tổng 100); tiêu chí không áp dụng cho nhu cầu được chia lại cho tiêu chí còn lại
      weights:
        level: 15
        goal: 20
        schedule: 20
        textbook: 10
        budget: 10
        location: 10
        rating: 15
  ai:
    provider: ${AI_PROVIDER} # Bắt buộc, không có mặc định: 'stub' cho offline/test, 'gemini' cho gọi thật
    timeout: 15s                 # NFR-10: khống chế timeout 15 giây
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:} # Không có mặc định; bắt buộc khi AI_PROVIDER=gemini
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  storage:
    credentials:
      root: ${STORAGE_CREDENTIALS_ROOT:${EDUFIT_STORAGE_CREDENTIALS_ROOT:var/credentials}}
      max-file-size-bytes: ${STORAGE_CREDENTIALS_MAX_SIZE:10485760}

# 6. Cấu hình Swagger / OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# 6. Logging
logging:
  level:
    vn.edufit: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
